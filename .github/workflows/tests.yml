---
name: Tests
run-name: "Tests (${{ github.head_ref || github.ref_name }})"

# Thin caller — logic lives in fireballenterprise/workflows_common (floating major tag @v1).
# Each `checks` entry is one matrix leg (isolated check-run).

on:
  pull_request:
    branches:
      - development
      - main
  push:
    branches:
      - main  # keep the status badge current after every merge

jobs:
  tests:
    uses: fireballenterprise/workflows_common/.github/workflows/python_tests.yml@v1
    with:
      checks: >-
        [
          {"name": "action_lint", "invoke": "tests.actionlint"},
          {"name": "pylint", "invoke": "tests.pylint"},
          {"name": "pytest", "invoke": "tests.pytest"},
          {"name": "ruff_lint", "invoke": "tests.rufflint"},
          {"name": "yaml_lint", "invoke": "tests.yamllint"}
        ]
